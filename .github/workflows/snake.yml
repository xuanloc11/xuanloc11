name: Update profile visuals

on:
  schedule:
    # Refresh at minute 17 of every hour.
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate fresh GitHub stats card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&card_width=495&line_height=20
          path: dist/stats.svg
          # PAT_1 includes private repository stats when configured; otherwise use public data.
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - name: Generate fresh top languages card
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&card_width=495&langs_count=6
          path: dist/top-langs.svg
          token: ${{ secrets.PAT_1 || secrets.GITHUB_TOKEN }}
          core_version: "2.2.0"
          fail_on_error: "true"

      - name: Generate light and dark snake animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate fresh streak card
        uses: DenverCoder1/github-readme-streak-stats@d855de1a23fe45bdda5ffbc28a6d4b80b0f107e1 # v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&timezone=Asia%2FHo_Chi_Minh
          path: dist/streak.svg
        env:
          DISABLE_CACHE: "true"

      - name: Publish profile images
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
          allow_empty_commit: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
